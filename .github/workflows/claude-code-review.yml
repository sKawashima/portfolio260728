name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # レビュー結果をPRへ投稿するため write が必要（read だと投稿が 403 になる）
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment を渡さないとプラグインは findings を出力するだけで投稿せずに終了する
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # permissionMode は default なので、Skill を明示許可しないと
          # /code-review:code-review 自体が user-rejected で弾かれる。
          # --allowedTools は追加ではなく厳格なホワイトリストとして効くため、
          # プラグインが使うツールを漏れなく列挙する:
          #   - gh / git      : 差分取得と投稿
          #   - TaskOutput/List: バックグラウンドのレビューエージェントの結果回収
          #   - node          : 指摘の裏取り(正規表現を実データで実行して検証する等)
          # Read / Grep などの読み取り専用ツールは既定で許可されるので不要。
          #
          # --append-system-prompt が無いと、プラグインが起動したレビューエージェントの
          # 完了通知を待つと言ってモデルがターンを終え、headless なのでその時点で
          # セッションごとレビューが破棄される
          claude_args: |
            --allowedTools "Skill,Bash(gh:*),Bash(git:*),Bash(node:*),TaskOutput,TaskList,mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "You are running headless in CI. The session ends the instant you reply without making a tool call, and any unfinished work is discarded. Therefore: never end your turn while background agents are still running. Do not say you will wait for notifications - no notification will ever arrive. Instead, poll with TaskOutput repeatedly until every background agent has finished, gather their findings, and post the review to GitHub. Only stop once the comments are actually posted."
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

