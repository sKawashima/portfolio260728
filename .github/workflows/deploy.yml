name: Build & Deploy

on:
  push:
    branches: [main]
  # note の記事一覧はビルド時に RSS から取得するため、push が無くても週1回は再ビルドして新着を反映する
  # (毎週月曜 09:00 JST = 00:00 UTC)
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Slack Comment (Deploy Start)
        if: github.event_name == 'push'
        uses: Ilshidur/action-slack@master
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        with:
          args: ${{ github.sha }}${{ ' のデプロイを開始するよ。' }}

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # astro:assets の最適化元(原寸PNG/JPG)は _astro/ にコピーされるがHTMLから参照されないため、
      # デプロイサイズ削減のため未参照の原本を除去する(参照があれば失敗して気づけるよう検査付き)
      - name: Remove unreferenced original images
        run: |
          for f in $(find dist/_astro -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \)); do
            name=$(basename "$f")
            if grep -rq "$name" dist --include='*.html' --include='*.css'; then
              echo "::error::$name is referenced; aborting cleanup" && exit 1
            fi
            rm "$f"
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true

      - name: Slack Notification (Build Failure)
        if: failure() && github.event_name == 'push'
        uses: homoluctus/slatify@master
        with:
          type: ${{ job.status }}
          job_name: '*Build*'
          mention: 'here'
          mention_if: 'failure'
          channel: '#blog'
          url: ${{ secrets.SLACK_WEBHOOK }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # deleteは行わない(dangerous-clean-slate無効)ため、サーバー上の既存ファイルは保持される
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /skawashima.com/
          state-name: .ftp-deploy-sync-state.json

      - name: Slack Notification (Deploy Failure)
        if: failure() && github.event_name == 'push'
        uses: homoluctus/slatify@master
        with:
          type: ${{ job.status }}
          job_name: '*Deploy*'
          mention: 'here'
          mention_if: 'failure'
          channel: '#blog'
          url: ${{ secrets.SLACK_WEBHOOK }}

      - name: Slack Comment (Deploy Complete)
        if: github.event_name == 'push'
        uses: Ilshidur/action-slack@master
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        with:
          args: 'デプロイしたよ。お疲れ、skawashima。'
