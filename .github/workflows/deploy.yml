name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # astro:assets の最適化元(原寸PNG/JPG)は _astro/ にコピーされるがHTMLから参照されないため、
      # デプロイサイズ削減のため未参照の原本を除去する(参照があれば失敗して気づけるよう検査付き)
      - name: Remove unreferenced original images
        run: |
          for f in $(find dist/_astro -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \)); do
            name=$(basename "$f")
            if grep -rq "$name" dist --include='*.html' --include='*.css'; then
              echo "::error::$name is referenced; aborting cleanup" && exit 1
            fi
            rm "$f"
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # deleteは行わない(dangerous-clean-slate無効)ため、サーバー上の既存ファイルは保持される
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /skawashima.com/
          state-name: .ftp-deploy-sync-state.json
